<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1260" viewBox="0 0 1700 1260" font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <defs>
        <marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
            <path d="M0 0 L9 4.5 L0 9 z" fill="#94a3b8"/>
        </marker>
        <style>
            .dim { stroke: #94a3b8; stroke-width: 1.2; }
            .dimText { fill: #475569; font-size: 13px; font-weight: 600; }
            .lbl { fill: #64748b; font-size: 12.5px; }
            .lblDark { fill: #0f172a; font-size: 13px; font-weight: 600; }
            .h { fill: #0f172a; font-size: 15px; font-weight: 700; }
            .body { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
            .part { fill: #e8eefc; stroke: #93c5fd; stroke-width: 1.4; }
            .metal { fill: #cbd5e1; stroke: #94a3b8; stroke-width: 1; }
            .num { fill: #ef4444; }
            .numText { fill: #fff; font-size: 12px; font-weight: 700; }
        </style>
    </defs>

    <rect width="1700" height="1260" fill="#ffffff"/>

    <!-- ================= Заголовок ================= -->
    <text x="80" y="58" fill="#0f172a" font-size="27" font-weight="800" letter-spacing="-0.5">SmartBin Eco — габариты и размещение датчиков</text>
    <text x="80" y="88" fill="#64748b" font-size="15">Вид спереди, разрез сбоку и план отсеков. Все размеры в миллиметрах.</text>
    <line x1="80" y1="108" x2="1620" y2="108" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- ================= ВИД СПЕРЕДИ ================= -->
    <text x="80" y="150" class="h">Вид спереди</text>
    <text x="80" y="172" class="lbl">450 × 500 × 900 мм, 72 л полезного объёма</text>

    <!-- размер ширины -->
    <line x1="80" y1="238" x2="395" y2="238" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="80" y1="232" x2="80" y2="270" class="dim"/>
    <line x1="395" y1="232" x2="395" y2="270" class="dim"/>
    <text x="237" y="228" text-anchor="middle" class="dimText">450</text>

    <!-- размер высоты -->
    <line x1="46" y1="270" x2="46" y2="900" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="40" y1="270" x2="80" y2="270" class="dim"/>
    <line x1="40" y1="900" x2="80" y2="900" class="dim"/>
    <text x="36" y="585" text-anchor="middle" class="dimText" transform="rotate(-90 36 585)">900</text>

    <!-- корпус -->
    <rect x="80" y="270" width="315" height="630" rx="14" class="body"/>
    <line x1="80" y1="300" x2="395" y2="300" stroke="#e2e8f0" stroke-width="1.4"/>

    <!-- окно загрузки -->
    <rect x="140" y="301" width="196" height="77" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/>
    <rect x="151" y="310" width="174" height="59" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="238" y="336" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="600">окно загрузки</text>
    <text x="238" y="354" text-anchor="middle" fill="#3b82f6" font-size="11">280 × 110, центр 800</text>

    <!-- индикатор -->
    <rect x="252" y="402" width="112" height="28" rx="14" fill="#0f172a"/>
    <circle cx="268" cy="416" r="4.5" fill="#10b981"/>
    <text x="281" y="420" fill="#e2e8f0" font-size="11.5" font-weight="600">онлайн · 4G</text>

    <!-- дверь -->
    <rect x="97" y="480" width="280" height="273" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="7 5"/>
    <rect x="358" y="588" width="9" height="46" rx="4.5" fill="#cbd5e1"/>
    <text x="237" y="612" text-anchor="middle" class="lbl">дверь отсеков · 400 × 390</text>
    <text x="237" y="632" text-anchor="middle" class="lbl" font-size="11.5">открывается на 100°</text>

    <!-- ножки -->
    <rect x="105" y="900" width="46" height="13" rx="4" class="metal"/>
    <rect x="324" y="900" width="46" height="13" rx="4" class="metal"/>
    <line x1="60" y1="913" x2="420" y2="913" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 4"/>

    <!-- ================= РАЗРЕЗ А–А ================= -->
    <text x="470" y="150" class="h">Разрез сбоку</text>
    <text x="470" y="172" class="lbl">Вид сбоку, передняя стенка слева</text>

    <!-- уровни справа -->
    <g class="lbl" font-size="11.5" fill="#94a3b8">
        <line x1="820" y1="270" x2="834" y2="270" stroke="#cbd5e1"/><text x="840" y="274">900 · верх</text>
        <line x1="820" y1="301" x2="834" y2="301" stroke="#cbd5e1"/><text x="840" y="305">855 · окно</text>
        <line x1="820" y1="333" x2="834" y2="333" stroke="#cbd5e1"/><text x="840" y="337">810 · потолок камеры</text>
        <line x1="820" y1="438" x2="834" y2="438" stroke="#cbd5e1"/><text x="840" y="442">660 · лоток</text>
        <line x1="820" y1="480" x2="834" y2="480" stroke="#cbd5e1"/><text x="840" y="484">600 · палуба</text>
        <line x1="820" y1="760" x2="834" y2="760" stroke="#cbd5e1"/><text x="840" y="764">200 · пол отсека</text>
    </g>

    <!-- корпус -->
    <rect x="470" y="270" width="350" height="630" rx="14" class="body"/>

    <!-- окно в передней стенке -->
    <rect x="470" y="301" width="34" height="77" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/>
    <path d="M504 301 L504 378" stroke="#2563eb" stroke-width="1.2"/>

    <!-- камера измерения -->
    <rect x="504" y="333" width="112" height="105" class="part" rx="6"/>
    <text x="516" y="326" class="lbl" font-size="10.5" fill="#1d4ed8">камера 140 × 160</text>

    <!-- потолок: камера и ToF -->
    <rect x="548" y="336" width="28" height="17" rx="3" fill="#1e293b"/>
    <circle cx="562" cy="352" r="5" fill="#64748b"/>
    <rect x="592" y="337" width="13" height="13" rx="2" class="metal"/>

    <!-- стенки датчиков -->
    <rect x="505" y="392" width="9" height="18" rx="2" fill="#ef4444" opacity="0.85"/>
    <circle cx="609" cy="402" r="5.5" fill="#475569"/>
    <rect x="592" y="424" width="16" height="9" rx="2" fill="#7c3aed" opacity="0.85"/>

    <!-- толкатель -->
    <line x1="512" y1="368" x2="548" y2="392" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <circle cx="548" cy="392" r="5" fill="#334155"/>

    <!-- лоток-платформа + тензодатчик -->
    <line x1="504" y1="438" x2="616" y2="438" stroke="#0f172a" stroke-width="3.4"/>
    <rect x="530" y="441" width="70" height="14" rx="2" class="metal"/>

    <!-- поворотный лоток -->
    <path d="M548 455 L600 455 L588 478 L536 478 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <path d="M586 466 a34 34 0 0 1 26 6" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

    <!-- палуба -->
    <line x1="470" y1="480" x2="820" y2="480" stroke="#94a3b8" stroke-width="4"/>
    <rect x="520" y="484" width="16" height="8" rx="2" class="metal"/>
    <rect x="700" y="484" width="16" height="8" rx="2" class="metal"/>

    <!-- отсеки: передний и задний ряды одинаковые -->
    <rect x="484" y="484" width="157" height="276" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="562" y="596" text-anchor="middle" class="lbl" font-size="12.5">отсек 18 л</text>
    <text x="562" y="616" text-anchor="middle" class="lbl" font-size="11">мешок на кольце</text>
    <rect x="648" y="484" width="157" height="276" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
    <text x="726" y="596" text-anchor="middle" class="lbl" font-size="12.5">отсек 18 л</text>
    <text x="726" y="616" text-anchor="middle" class="lbl" font-size="11">задний ряд</text>

    <!-- полка и база -->
    <rect x="470" y="760" width="350" height="14" class="metal"/>
    <rect x="470" y="774" width="350" height="126" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="645" y="828" class="lbl" font-size="12">БП 5 В / 5 А, ESP32-S3,</text>
    <text x="645" y="846" class="lbl" font-size="12">драйверы, канал кабелей</text>

    <!-- размер глубины -->
    <line x1="470" y1="936" x2="820" y2="936" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="470" y1="913" x2="470" y2="942" class="dim"/>
    <line x1="820" y1="913" x2="820" y2="942" class="dim"/>
    <text x="645" y="929" text-anchor="middle" class="dimText">500</text>
    <text x="470" y="960" class="lbl" font-size="11.5">Все четыре отсека одинаковые: 200 × 225 × 400 мм, 18 л каждый.</text>
    <text x="470" y="978" class="lbl" font-size="11.5">В разрезе видны передний и задний ряды — они идентичны.</text>

    <!-- ================= НОМЕРА ДАТЧИКОВ ================= -->
    <g stroke="#cbd5e1" stroke-width="1" fill="none">
        <path d="M449 318 L468 318"/>
        <path d="M449 401 L502 401"/>
        <path d="M449 500 L519 490"/>
        <path d="M668 329 L566 344"/>
        <path d="M707 322 L604 341"/>
        <path d="M689 392 L617 402"/>
        <path d="M689 424 L609 428"/>
        <path d="M689 456 L575 450"/>
        <path d="M548 373 L548 387"/>
    </g>
    <g>
        <circle cx="438" cy="318" r="11" class="num"/><text x="438" y="322.5" text-anchor="middle" class="numText">9</text>
        <circle cx="438" cy="401" r="11" class="num"/><text x="438" y="405.5" text-anchor="middle" class="numText">1</text>
        <circle cx="438" cy="500" r="11" class="num"/><text x="438" y="504.5" text-anchor="middle" class="numText">8</text>
        <circle cx="668" cy="318" r="11" class="num"/><text x="668" y="322.5" text-anchor="middle" class="numText">2</text>
        <circle cx="718" cy="318" r="11" class="num"/><text x="718" y="322.5" text-anchor="middle" class="numText">3</text>
        <circle cx="700" cy="392" r="11" class="num"/><text x="700" y="396.5" text-anchor="middle" class="numText">4</text>
        <circle cx="700" cy="424" r="11" class="num"/><text x="700" y="428.5" text-anchor="middle" class="numText">5</text>
        <circle cx="700" cy="456" r="11" class="num"/><text x="700" y="460.5" text-anchor="middle" class="numText">6</text>
        <circle cx="548" cy="362" r="11" class="num"/><text x="548" y="366.5" text-anchor="middle" class="numText">7</text>
    </g>

    <!-- ================= ПЛАН ================= -->
    <text x="990" y="268" class="h">План отсеков</text>

    <!-- ширина плана -->
    <line x1="990" y1="300" x2="1305" y2="300" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="1147" y="294" text-anchor="middle" class="dimText">450</text>

    <!-- глубина плана -->
    <line x1="966" y1="320" x2="966" y2="670" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="958" y="495" text-anchor="middle" class="dimText" transform="rotate(-90 958 495)">500</text>

    <rect x="990" y="320" width="315" height="350" rx="14" class="body"/>

    <!-- отсеки -->
    <rect x="1005" y="332" width="135" height="150" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
    <text x="1014" y="353" class="lbl" font-size="12">Пластик</text>

    <rect x="1155" y="332" width="135" height="150" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
    <text x="1281" y="353" text-anchor="end" class="lbl" font-size="12">Стекло</text>

    <rect x="1005" y="498" width="135" height="150" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
    <text x="1014" y="634" class="lbl" font-size="12">Бумага</text>

    <rect x="1155" y="498" width="135" height="150" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
    <text x="1281" y="634" text-anchor="end" class="lbl" font-size="12">Органика</text>

    <!-- поворотный лоток -->
    <circle cx="1147" cy="495" r="118" fill="rgba(37,99,235,0.06)" stroke="#93c5fd" stroke-width="1.6" stroke-dasharray="7 6"/>
    <circle cx="1222" cy="407" r="28" fill="#2563eb" opacity="0.22" stroke="#2563eb" stroke-width="2"/>
    <line x1="1147" y1="495" x2="1222" y2="407" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4 4"/>
    <text x="1104" y="470" text-anchor="end" class="lbl" font-size="11" fill="#1d4ed8">R 165</text>
    <circle cx="1147" cy="495" r="6" fill="#2563eb"/>
    <text x="1147" y="536" text-anchor="middle" class="lbl" font-size="10.5" fill="#3b82f6">ось лотка</text>

    <text x="1147" y="694" text-anchor="middle" class="lbl" font-size="11.5">отверстие лотка встаёт над центром отсека: 0° / 90° / 180° / 270°</text>

    <!-- ================= ТАБЛИЦА ДАТЧИКОВ ================= -->
    <text x="900" y="746" class="h">Датчики и точки установки</text>

    <rect x="900" y="762" width="760" height="452" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>

    <!-- заголовок таблицы -->
    <rect x="900" y="762" width="760" height="40" rx="13" fill="#eef2f8"/>
    <rect x="900" y="790" width="760" height="12" fill="#eef2f8"/>
    <text x="920" y="788" class="lbl" font-size="11.5" font-weight="700" fill="#475569">№</text>
    <text x="960" y="788" class="lbl" font-size="11.5" font-weight="700" fill="#475569">ДАТЧИК</text>
    <text x="1170" y="788" class="lbl" font-size="11.5" font-weight="700" fill="#475569">МОДЕЛЬ</text>
    <text x="1360" y="788" class="lbl" font-size="11.5" font-weight="700" fill="#475569">ГДЕ СТОИТ</text>

    <g font-size="12">
        <!-- 1 -->
        <circle cx="932" cy="828" r="10" class="num"/><text x="932" y="832" text-anchor="middle" class="numText">1</text>
        <text x="960" y="832" class="lblDark">Индуктивный датчик металла</text>
        <text x="1170" y="832" class="lbl">LJ12A3-4-Z/BX</text>
        <text x="1360" y="832" class="lbl">Стенка камеры, 5 мм до предмета</text>
        <line x1="900" y1="848" x2="1660" y2="848" stroke="#e8eef5"/>

        <!-- 2 -->
        <circle cx="932" cy="874" r="10" class="num"/><text x="932" y="878" text-anchor="middle" class="numText">2</text>
        <text x="960" y="878" class="lblDark">Камера + LED-кольцо</text>
        <text x="1170" y="878" class="lbl">OV5640, 120°</text>
        <text x="1360" y="878" class="lbl">Потолок камеры, 150 мм до лотка</text>
        <line x1="900" y1="894" x2="1660" y2="894" stroke="#e8eef5"/>

        <!-- 3 -->
        <circle cx="932" cy="920" r="10" class="num"/><text x="932" y="924" text-anchor="middle" class="numText">3</text>
        <text x="960" y="924" class="lblDark">ToF объёма и высоты</text>
        <text x="1170" y="924" class="lbl">VL53L1X</text>
        <text x="1360" y="924" class="lbl">Рядом с камерой, смотрит на лоток</text>
        <line x1="900" y1="940" x2="1660" y2="940" stroke="#e8eef5"/>

        <!-- 4 -->
        <circle cx="932" cy="966" r="10" class="num"/><text x="932" y="970" text-anchor="middle" class="numText">4</text>
        <text x="960" y="970" class="lblDark">Микрофон</text>
        <text x="1170" y="970" class="lbl">INMP441, I2S</text>
        <text x="1360" y="970" class="lbl">Стенка за отверстием 1 мм, демпфер</text>
        <line x1="900" y1="986" x2="1660" y2="986" stroke="#e8eef5"/>

        <!-- 5 -->
        <circle cx="932" cy="1012" r="10" class="num"/><text x="932" y="1016" text-anchor="middle" class="numText">5</text>
        <text x="960" y="1016" class="lblDark">NIR-спектрометр</text>
        <text x="1170" y="1016" class="lbl">AS7263, 610–860 нм</text>
        <text x="1360" y="1016" class="lbl">Задняя стенка, окно + подсветка</text>
        <line x1="900" y1="1032" x2="1660" y2="1032" stroke="#e8eef5"/>

        <!-- 6 -->
        <circle cx="932" cy="1058" r="10" class="num"/><text x="932" y="1062" text-anchor="middle" class="numText">6</text>
        <text x="960" y="1062" class="lblDark">Тензодатчик веса</text>
        <text x="1170" y="1062" class="lbl">5 кг + HX711</text>
        <text x="1360" y="1062" class="lbl">Под лотком-платформой</text>
        <line x1="900" y1="1078" x2="1660" y2="1078" stroke="#e8eef5"/>

        <!-- 7 -->
        <circle cx="932" cy="1104" r="10" class="num"/><text x="932" y="1108" text-anchor="middle" class="numText">7</text>
        <text x="960" y="1108" class="lblDark">Толкатель «тычок»</text>
        <text x="1170" y="1108" class="lbl">SG90, ход 20 мм</text>
        <text x="1360" y="1108" class="lbl">Задняя стенка камеры, сверху</text>
        <line x1="900" y1="1124" x2="1660" y2="1124" stroke="#e8eef5"/>

        <!-- 8 -->
        <circle cx="932" cy="1150" r="10" class="num"/><text x="932" y="1154" text-anchor="middle" class="numText">8</text>
        <text x="960" y="1154" class="lblDark">ToF заполнения, 4 шт</text>
        <text x="1170" y="1154" class="lbl">VL53L1X</text>
        <text x="1360" y="1154" class="lbl">Под палубой, по одному на отсек</text>
        <line x1="900" y1="1170" x2="1660" y2="1170" stroke="#e8eef5"/>

        <!-- 9 -->
        <circle cx="932" cy="1196" r="10" class="num"/><text x="932" y="1200" text-anchor="middle" class="numText">9</text>
        <text x="960" y="1200" class="lblDark">Датчик окна загрузки</text>
        <text x="1170" y="1200" class="lbl">ИК-концевик</text>
        <text x="1360" y="1200" class="lbl">Кромка окна, фиксирует вброс</text>
    </g>

    <!-- ================= ПОЧЕМУ ТАК ================= -->
    <text x="80" y="1000" class="h">Почему именно так</text>
    <g class="lbl" font-size="13">
        <text x="80" y="1032">• Окно на 800 мм — край на уровне локтя: не нужно наклоняться, видно лоток.</text>
        <text x="80" y="1062">• Камера в 150 мм от лотка: при FOV 70° в кадр целиком попадает площадка 130 × 150.</text>
        <text x="80" y="1092">• Индуктивный датчик стоит первым в цепочке: металл определяется до ML, точность ~97%.</text>
        <text x="80" y="1122">• ToF в каждом отсеке видит перекос: урна сообщает не «60%», а «пластик 90%, бумага 20%».</text>
        <text x="80" y="1152">• Микрофон и NIR вынесены от сервоприводов; камера под углом, чтобы не ловить блик плёнки.</text>
        <text x="80" y="1182">• Отсеки 4 × 18 л = 72 л; ниже палубы — блок питания и электроника, центр тяжести внизу.</text>
    </g>

    <text x="80" y="1224" fill="#94a3b8" font-size="11.5">Компоновка концептуальная: оптический конус камеры, акустику камеры и срабатывание индуктивного датчика нужно проверять на собранном макете.</text>
</svg>
