<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <defs>
        <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
            <path d="M0 0 L9 4.5 L0 9 z" fill="#2563eb"/>
        </marker>
        <style>
            .body { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
            .sheet { fill: #eef2f7; stroke: #94a3b8; stroke-width: 1.5; }
            .print { fill: #fde68a; stroke: #d97706; stroke-width: 2; }
            .ghost { fill: none; stroke: #cbd5e1; stroke-width: 1.4; stroke-dasharray: 5 4; }
            .title { fill: #0f172a; font-size: 26px; font-weight: 800; }
            .sub { fill: #64748b; font-size: 14px; }
            .h { fill: #0f172a; font-size: 15px; font-weight: 700; }
            .txt { fill: #475569; font-size: 12.5px; }
            .num { fill: #d97706; }
            .numText { fill: #fff; font-size: 12px; font-weight: 700; }
        </style>
    </defs>

    <rect width="1500" height="1080" fill="#ffffff"/>

    <text x="60" y="58" class="title">Как собирается механизм сортировки</text>
    <text x="60" y="86" class="sub">Жёлтые детали — печатные (STL). Серые — листовой ПВХ 5 мм по DXF. Размеры в мм.</text>
    <line x1="60" y1="104" x2="1440" y2="104" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- ================= A: общий вид ================= -->
    <text x="60" y="136" class="h">Общий вид сбоку</text>

    <rect x="100" y="190" width="189" height="378" rx="6" class="body"/>

    <!-- окно загрузки -->
    <rect x="100" y="209" width="13" height="46" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>

    <!-- палуба и полка -->
    <line x1="100" y1="316" x2="289" y2="316" stroke="#94a3b8" stroke-width="3"/>
    <line x1="100" y1="484" x2="289" y2="484" stroke="#94a3b8" stroke-width="3"/>
    <text x="296" y="320" class="txt">палуба</text>
    <text x="296" y="488" class="txt">полка</text>

    <!-- отсеки -->
    <rect x="108" y="322" width="82" height="156" class="ghost"/>
    <rect x="198" y="322" width="82" height="156" class="ghost"/>
    <text x="140" y="404" class="txt">18 л</text>
    <text x="230" y="404" class="txt">18 л</text>

    <!-- зона увеличения -->
    <rect x="92" y="203" width="205" height="130" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="7 5"/>
    <text x="92" y="596" class="txt" fill="#2563eb">Выделенная зона показана справа крупно</text>

    <text x="100" y="614" class="txt">Корпус 450 × 500 × 900, панели 5 мм</text>

    <!-- ================= B: узел крупно ================= -->
    <text x="470" y="136" class="h">Узел сортировки, увеличение</text>

    <!-- стенки корпуса -->
    <rect x="470" y="190" width="28" height="434" class="sheet"/>
    <rect x="1072" y="190" width="28" height="434" class="sheet"/>

    <!-- окно -->
    <rect x="470" y="211" width="28" height="154" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="424" y="292" class="txt">окно</text>

    <!-- камера измерения -->
    <rect x="666" y="274" width="196" height="210" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="676" y="296" class="txt">камера измерения 140 × 160</text>

    <!-- палуба -->
    <rect x="470" y="568" width="630" height="10" class="sheet"/>
    <text x="1120" y="576" class="txt">палуба 600</text>

    <!-- заслонка -->
    <rect x="694" y="478" width="182" height="6" class="print"/>
    <circle cx="694" cy="481" r="5" fill="#d97706"/>
    <text x="700" y="470" class="txt" fill="#b45309">заслонка 130 × 150</text>

    <!-- ось -->
    <rect x="779" y="484" width="12" height="84" fill="#cbd5e1" stroke="#94a3b8"/>
    <text x="742" y="540" class="txt">ось Ø12</text>

    <!-- кронштейн -->
    <rect x="736" y="561" width="98" height="7" class="print"/>
    <rect x="761" y="547" width="13" height="14" class="print"/>
    <rect x="796" y="547" width="13" height="14" class="print"/>

    <!-- жёлоб -->
    <path d="M790 500 L1010 552 L1010 566 L790 514 Z" class="print"/>
    <path d="M1010 552 L1024 555 L1024 569 L1010 566 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <text x="900" y="536" class="txt" fill="#b45309">жёлоб</text>

    <!-- держатели ToF -->
    <rect x="548" y="578" width="16" height="8" class="print"/>
    <rect x="1000" y="578" width="16" height="8" class="print"/>
    <path d="M556 586 L528 622 L584 622 Z" fill="rgba(217,119,6,.12)" stroke="#d97706" stroke-dasharray="3 4"/>
    <path d="M1008 586 L980 622 L1036 622 Z" fill="rgba(217,119,6,.12)" stroke="#d97706" stroke-dasharray="3 4"/>

    <!-- номера и выноски -->
    <g>
        <circle cx="900" cy="490" r="12" class="num"/><text x="900" y="494.5" text-anchor="middle" class="numText">1</text>
        <circle cx="700" cy="565" r="12" class="num"/><text x="700" y="569.5" text-anchor="middle" class="numText">2</text>
        <circle cx="660" cy="470" r="12" class="num"/><text x="660" y="474.5" text-anchor="middle" class="numText">3</text>
        <circle cx="520" cy="565" r="12" class="num"/><text x="520" y="569.5" text-anchor="middle" class="numText">4</text>
    </g>

    <path d="M900 502 L900 522" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M712 565 L734 565" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M660 482 L674 484" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M520 577 L546 582" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr)"/>

    <text x="560" y="644" class="txt">Четыре окна в палубе по 110 мм, по одному на отсек 18 л</text>

    <!-- ================= порядок сборки ================= -->
    <line x1="60" y1="676" x2="1440" y2="676" stroke="#e2e8f0"/>
    <text x="60" y="710" class="h">Порядок сборки</text>

    <g class="txt">
        <text x="60" y="742">1. Собрать коробку: дно, две боковины, задняя стенка, передняя с окном и дверью.</text>
        <text x="60" y="768">2. Поставить полку на 200 мм от низа и опустить в неё четыре ведра.</text>
        <text x="60" y="794">3. Прикрутить палубу на 600 мм и выровнять по уровню — от неё зависит ход жёлоба.</text>
        <text x="60" y="820">4. Вкрутить в центр палубы кронштейн, запрессовать подшипник 6001, вставить ось Ø12.</text>
        <text x="60" y="846">5. Насадить жёлоб на ось и накрыть вторым кронштейном — ось держится в двух опорах.</text>
        <text x="60" y="872">6. Поставить заслонку на петлю под камерой и соединить её проушину с сервоприводом.</text>
        <text x="60" y="898">7. Прикрутить четыре держателя ToF под палубой, по одному над каждым окном.</text>
        <text x="60" y="924">8. Проверить от руки: жёлоб доходит до всех четырёх окон, не задевая стенок.</text>
    </g>

    <rect x="60" y="950" width="1380" height="62" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="80" y="976" class="txt" fill="#92400e">Важно: жёлоб не крепится к оси намертво — садится на шлицы или два винта М4 через ступицу,</text>
    <text x="80" y="996" class="txt" fill="#92400e">чтобы при заклинивании он провернулся, а не сломал редуктор.</text>
</svg>
