<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1150" viewBox="0 0 900 1150" font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <defs>
        <marker id="a" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
            <path d="M0 0 L9 4.5 L0 9 z" fill="#94a3b8"/>
        </marker>
        <style>
            .dim { stroke: #94a3b8; stroke-width: 1.2; }
            .dimText { fill: #475569; font-size: 14px; font-weight: 600; }
            .lbl { fill: #64748b; font-size: 13px; }
            .h { fill: #0f172a; font-size: 22px; font-weight: 800; }
            .panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
            .hole { fill: #ffffff; stroke: #2563eb; stroke-width: 1.4; }
            .slot { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.2; }
            .axis { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 12 4 3 4; }
            .num { fill: #ef4444; }
            .numText { fill: #fff; font-size: 12px; font-weight: 700; }
        </style>
    </defs>

    <rect width="900" height="1150" fill="#ffffff"/>

    <text x="60" y="56" class="h">Боковина корпуса — превью</text>
    <text x="60" y="84" class="lbl">500 × 900 × 5 мм · ПВХ или АБС · левая и правая зеркальны</text>

    <!-- размеры -->
    <line x1="120" y1="140" x2="520" y2="140" class="dim" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="320" y="132" text-anchor="middle" class="dimText">500</text>
    <line x1="88" y1="180" x2="88" y2="900" class="dim" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="80" y="540" text-anchor="middle" class="dimText" transform="rotate(-90 80 540)">900</text>

    <!-- панель -->
    <rect x="120" y="180" width="400" height="720" rx="3" class="panel"/>

    <!-- осевые линии -->
    <line x1="320" y1="150" x2="320" y2="920" class="axis"/>
    <line x1="120" y1="540" x2="520" y2="540" class="axis"/>

    <!-- крепёжные отверстия Ø6.5 (r = 2.6 px = 3.25 мм) -->
    <circle cx="140" cy="212" r="2.6" class="hole"/>
    <circle cx="140" cy="540" r="2.6" class="hole"/>
    <circle cx="140" cy="868" r="2.6" class="hole"/>
    <circle cx="500" cy="212" r="2.6" class="hole"/>
    <circle cx="500" cy="540" r="2.6" class="hole"/>
    <circle cx="500" cy="868" r="2.6" class="hole"/>

    <!-- вентиляционные пазы 70×6: 4 шт, равные промежутки 44 мм -->
    <rect x="155" y="260" width="56" height="4.8" rx="2.4" class="slot"/>
    <rect x="246" y="260" width="56" height="4.8" rx="2.4" class="slot"/>
    <rect x="338" y="260" width="56" height="4.8" rx="2.4" class="slot"/>
    <rect x="429" y="260" width="56" height="4.8" rx="2.4" class="slot"/>

    <!-- отверстия под полку: 200 мм от низа -->
    <circle cx="256" cy="740" r="2.6" class="hole"/>
    <circle cx="384" cy="740" r="2.6" class="hole"/>

    <!-- вырез под кабель 60 × 25 -->
    <path d="M472 900 L472 880 L520 880 L520 900 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>

    <!-- номера -->
    <g>
        <circle cx="186" cy="212" r="11" class="num"/><text x="186" y="216.5" text-anchor="middle" class="numText">1</text>
        <circle cx="132" cy="262" r="11" class="num"/><text x="132" y="266.5" text-anchor="middle" class="numText">2</text>
        <circle cx="256" cy="704" r="11" class="num"/><text x="256" y="708.5" text-anchor="middle" class="numText">3</text>
        <circle cx="452" cy="866" r="11" class="num"/><text x="452" y="870.5" text-anchor="middle" class="numText">4</text>
    </g>

    <!-- уровни -->
    <g class="lbl" font-size="11.5" fill="#94a3b8">
        <line x1="524" y1="262" x2="538" y2="262" stroke="#cbd5e1"/><text x="544" y="266">100 мм от верха</text>
        <line x1="524" y1="740" x2="538" y2="740" stroke="#cbd5e1"/><text x="544" y="744">200 мм от низа</text>
    </g>

    <text x="60" y="960" class="h" font-size="17">Что на панели</text>
    <g class="lbl" font-size="13.5">
        <text x="60" y="994">1 — крепёжные отверстия Ø6.5 под винт М6, 6 шт (по 3 на сторону, 25 мм от кромок)</text>
        <text x="60" y="1022">2 — вентиляционные пазы 70 × 6, 4 шт, 100 мм от верхней кромки, шаг 114 мм</text>
        <text x="60" y="1050">3 — отверстия Ø6.5 под полку отсеков, 200 мм от низа, симметрично</text>
        <text x="60" y="1078">4 — вырез под кабель 60 × 25 в нижнем правом углу</text>
    </g>

    <line x1="60" y1="1100" x2="840" y2="1100" stroke="#e2e8f0"/>
    <text x="60" y="1126" class="lbl" font-size="12">Чертёж в масштабе: 1 мм = 0.8 px. Отверстия нарисованы по фактическому диаметру.</text>
</svg>
