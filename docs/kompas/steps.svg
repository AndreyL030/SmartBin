<text x="120.0" y="724.0" font-size="15" font-weight="700" fill="#0f172a">Перегородки: вид сверху</text><circle cx="90.0" cy="719.0" r="15" fill="#0f172a"/><text x="90.0" y="724.0" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text><rect x="120.0" y="740.0" width="189.0" height="210.0" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/><rect x="122.1" y="742.1" width="84.0" height="94.5" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="122.1" y="845.0" width="84.0" height="94.5" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="214.5" y="742.1" width="84.0" height="94.5" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="214.5" y="845.0" width="84.0" height="94.5" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="212.4" y="742.1" width="2.1" height="205.8" rx="0" fill="#fbbf24" stroke="#b45309" stroke-width="1.6"/><rect x="122.1" y="842.9" width="184.8" height="2.1" rx="0" fill="#fbbf24" stroke="#b45309" stroke-width="1.6"/>
