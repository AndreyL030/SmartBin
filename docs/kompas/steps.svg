<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1330" font-family="Inter, Arial">
<rect width="100%%" height="100%%" fill="#ffffff"/>
<text x="70" y="56" font-size="25" font-weight="800" fill="#0f172a">Сборка урны по шагам</text>
<text x="70" y="82" font-size="13" fill="#64748b">Серый — корпус, голубой — уже собрано, оранжевый — добавляем на этом шаге. Масштаб одинаковый.</text>
