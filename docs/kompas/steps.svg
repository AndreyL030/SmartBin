<text x="1080.0" y="724.0" font-size="15" font-weight="700" fill="#0f172a">Жёлоб и заслонка</text><circle cx="1050.0" cy="719.0" r="15" fill="#0f172a"/><text x="1050.0" y="724.0" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">6</text><rect x="1080.0" y="740.0" width="210.0" height="378.0" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/><path d="M1174.5 845.0 L1237.5 863.9 L1237.5 868.9 L1174.5 850.0 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1.8"/><rect x="1147.2" y="838.7" width="54.6" height="2.1" rx="0" fill="#dbe6f5" stroke="#94a3b8" stroke-width="1.6"/><line x1="1070.0" y1="870.2" x2="1070.0" y2="1034.0" stroke="#94a3b8" stroke-width="2.4" stroke-dasharray="7 5"/>
<text x="120" y="660" font-size="11.5" fill="#475569">Дно ставим внутрь на 20 мм, боковины притягиваем уголками.</text>
<text x="600" y="660" font-size="11.5" fill="#475569">Окно 280 × 110, проём 400 × 390. Панель закрывает торцы боковин.</text>
<text x="1080" y="660" font-size="11.5" fill="#475569">Полка на 200 мм, на неё четыре ведра 200 × 225 × 400.</text>
<text x="120" y="1190" font-size="11.5" fill="#475569">Перегородки A и B делят низ на четыре отсека 200 × 225.</text>
<text x="600" y="1190" font-size="11.5" fill="#475569">Палуба на 600 мм, в центре кронштейн с подшипником и ось Ø12.</text>
<text x="1080" y="1190" font-size="11.5" fill="#475569">Жёлоб садится на ось, заслонка подвешивается над ним.</text>
</svg>